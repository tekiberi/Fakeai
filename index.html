<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Client</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col">

    <!-- Header / API Key Bar -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-2">
            <div class="bg-blue-600 w-3 h-3 rounded-full animate-pulse"></div>
            <h1 class="font-bold text-lg">Gemini Web Client</h1>
        </div>
        <div class="flex items-center gap-2 w-full sm:w-auto">
            <input type="password" id="apiKey" placeholder="Paste your Gemini API Key here..." 
                class="bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-lg text-sm w-full sm:w-72 focus:outline-none focus:border-blue-500">
            <button onclick="saveKey()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded-lg text-sm font-medium transition">Save</button>
        </div>
    </header>

    <!-- Chat Box Container -->
    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
        <div class="flex items-start gap-3">
            <div class="bg-blue-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold shrink-0">AI</div>
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 text-sm max-w-[80%] leading-relaxed">
                Hello! Make sure your API key is saved above, type a message below, and let's test it out.
            </div>
        </div>
    </main>

    <!-- Input Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 p-4">
        <form id="chatForm" onsubmit="handleSendMessage(event)" class="max-w-3xl mx-auto flex gap-2">
            <input type="text" id="userInput" placeholder="Type your prompt here..." autocomplete="off"
                class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500">
            <button type="submit" id="sendBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-medium text-sm transition flex items-center justify-center">
                Send
            </button>
        </form>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Load saved API key on startup
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
            }
        });

        function saveKey() {
            const key = document.getElementById('apiKey').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                alert('API Key saved successfully to browser storage!');
            } else {
                localStorage.removeItem('gemini_api_key');
                alert('API Key cleared.');
            }
        }

        async function handleSendMessage(event) {
            event.preventDefault();
            const apiKey = document.getElementById('apiKey').value.trim() || localStorage.getItem('gemini_api_key');
            const inputField = document.getElementById('userInput');
            const prompt = inputField.value.trim();
            const chatContainer = document.getElementById('chatContainer');

            if (!apiKey) {
                alert('Please enter and save your Gemini API Key in the top right bar first!');
                return;
            }
            if (!prompt) return;

            // Clear input box
            inputField.value = '';

            // Append User Message to UI
            chatContainer.innerHTML += `
                <div class="flex items-start gap-3 justify-end">
                    <div class="bg-slate-700 border border-slate-600 rounded-2xl p-4 text-sm max-w-[80%] leading-relaxed">
                        ${escapeHtml(prompt)}
                    </div>
                    <div class="bg-slate-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold shrink-0">You</div>
                </div>
            `;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Append Loading Indicator
            const loadingId = 'loading-' + Date.now();
            chatContainer.innerHTML += `
                <div id="${loadingId}" class="flex items-start gap-3">
                    <div class="bg-blue-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold shrink-0">AI</div>
                    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 text-sm text-slate-400 animate-pulse">
                        Thinking...
                    </div>
                </div>
            `;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // Call Gemini 2.5 Flash API endpoint directly from client-side JavaScript
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                
                // Remove loading indicator
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();

                if (data.error) {
                    throw new Error(data.error.message || 'Unknown API Error');
                }

                // Extract reply text safely
                const aiReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Received an empty response from model.";

                // Append AI Response to UI
                chatContainer.innerHTML += `
                    <div class="flex items-start gap-3">
                        <div class="bg-blue-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold shrink-0">AI</div>
                        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 text-sm max-w-[80%] leading-relaxed whitespace-pre-wrap">${escapeHtml(aiReply)}</div>
                    </div>
                `;
            } catch (error) {
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();

                chatContainer.innerHTML += `
                    <div class="flex items-start gap-3">
                        <div class="bg-red-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold shrink-0">!</div>
                        <div class="bg-red-950/50 border border-red-800 text-red-200 rounded-2xl p-4 text-sm max-w-[80%] leading-relaxed">
                            Error: ${escapeHtml(error.message)}
                        </div>
                    </div>
                `;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
